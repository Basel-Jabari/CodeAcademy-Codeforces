name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the commit
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      # CI=true also turns lint warnings into build errors, so this guards
      # against unused imports and similar slipping in.
      - name: Build
        run: npm run build
        env:
          CI: true
